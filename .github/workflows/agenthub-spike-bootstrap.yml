name: AgentHub spike bootstrap

on:
  workflow_dispatch:
    inputs:
      action:
        description: Bootstrap action
        required: true
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Read one-time bootstrap credentials from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_MECHID_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.ENV_NAME }}
          secret-path: /agenthub-spike/bootstrap/
          export-type: env
      - name: Configure temporary bootstrap credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Validate bootstrap configuration
        working-directory: infrastructure/bootstrap
        run: |
          terraform init -backend=false
          terraform validate
          terraform plan -out=tfplan
      - name: Apply bootstrap only after protected-environment approval
        if: ${{ inputs.action == 'apply' }}
        working-directory: infrastructure/bootstrap
        run: terraform apply -auto-approve tfplan
